name: Update CBR rates

on:
  schedule:
    - cron: '0 6 * * *'  # каждый день в 6:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/update_rates.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/rates.json
          git diff --cached --quiet || (git commit -m "Update CBR rates $(date +%Y-%m-%d)" && git push)
