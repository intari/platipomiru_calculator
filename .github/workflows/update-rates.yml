name: Update CBR Rates Daily

on:
  schedule:
    - cron: '0 5 * * *'  # 08:00 MSK (UTC+3)
  workflow_dispatch:      # Ручной запуск тоже доступен

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CBR rates
        run: |
          curl -s "https://www.cbr-xml-daily.ru/daily_json.js" > data/rates.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git diff --cached --quiet || git commit -m "Update CBR rates: $(date -u +%Y-%m-%d)"
          git push
